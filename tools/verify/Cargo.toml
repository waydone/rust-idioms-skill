[package]
name = "rust-idioms-verify"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
rayon = "1"
proptest = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
futures = "0.3"

[dev-dependencies]
hello-derive = { path = "hello-derive" }
